name: Build ZMK Firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:   # erlaubt manuelles Auslösen im GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Zephyr + west
        run: |
          pip install west
          west init -l app
          west update

      - name: Build firmware
        run: |
          west build -b seeeduino_xiao_ble -- -DSHIELD=tester_xiao

      - name: Download uf2 converter
        run: |
          curl -L https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py -o uf2conv.py

      - name: Convert HEX to UF2
        run: |
          python uf2conv.py build/zephyr/zephyr.hex \
            --family 0xADA52840 \
            --output tester_xiao-seeeduino_xiao_ble-zmk.uf2

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: firmware
          path: tester_xiao-seeeduino_xiao_ble-zmk.uf2
